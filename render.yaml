# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: sf-crud-app            # Current public URL: https://salesforce-crud-app-pzbo.onrender.com
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_LOGIN_URL
        value: https://login.salesforce.com
      - key: APP_URL
        value: https://salesforce-crud-app-pzbo.onrender.com
